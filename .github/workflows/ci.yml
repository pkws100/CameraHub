name: Camera Hub CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare non-secret Compose fixtures
        run: |
          mkdir -p poc/runtime/secrets
          mkdir -p poc/runtime/acceptance
          printf 'ci-only-placeholder\n' > poc/runtime/secrets/zmodo_secret_key
          printf 'ci-only-placeholder\n' > poc/runtime/secrets/zmodo_internal_token
          printf 'ci-only-placeholder\n' > poc/runtime/secrets/czeview_adapter_token
          printf 'ci-only-placeholder\n' > poc/runtime/secrets/netatmo_adapter_token
          printf 'ci-only-placeholder\n' > poc/runtime/secrets/detection_adapter_token
          printf 'ci-only-placeholder\n' > poc/runtime/acceptance/zmodo_secret_key
          printf 'ci-only-placeholder\n' > poc/runtime/acceptance/zmodo_internal_token
          printf 'ci-only-placeholder\n' > poc/runtime/acceptance/detection_adapter_token

      - name: Validate JavaScript
        run: |
          node --check poc/web/app.js
          node --check poc/web/display-device.js
          node --check poc/web/reader.js
          node --check poc/web/sw.js
          node --check playwright.config.js
          node --check poc/e2e/camera-hub.spec.js
          node --check poc/e2e/display-device.spec.js
          node --check poc/e2e/synthetic-stack.spec.js

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            $errors += $parseErrors
          }
          if ($errors.Count) {
            $errors | Format-List
            throw "PowerShell syntax validation failed."
          }

      - name: Validate Compose configurations
        env:
          ZMODO_BIND_IP: 192.168.1.50
          CAMERA_HUB_PRIVATE_HTTP_NETWORKS: 192.168.1.0/24
        run: |
          docker compose -f poc/docker-compose.yml config --quiet
          docker compose -f poc/docker-compose.yml -f poc/docker-compose.http-test.yml config --quiet
          docker compose -f poc/docker-compose.yml -f poc/docker-compose.https.yml config --quiet
          docker compose -f poc/acceptance/docker-compose.yml config --quiet

      - name: Validate Caddy gateways
        run: |
          docker run --rm -e ZMODO_BIND_IP=192.168.1.50 \
            -v "$PWD/poc/proxy/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm -e ZMODO_BIND_IP=192.168.1.50 \
            -v "$PWD/poc/proxy/Caddyfile.http:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile
          docker run --rm \
            -v "$PWD/poc/acceptance/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.0-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Build backend test image
        run: docker build -t camerahub-backend-ci poc/backend

      - name: Run backend integration suite
        run: docker run --rm --entrypoint python -e PYTHONPATH=/app camerahub-backend-ci /app/tests/integration.py

      - name: Build and test CZEview bridge
        run: |
          docker build -t camerahub-czeview-ci poc/czeview
          docker run --rm --entrypoint python -e PYTHONPATH=/app camerahub-czeview-ci \
            -m unittest discover -s /app/tests -p 'test_*.py'

      - name: Build and test detection worker
        run: |
          docker build -t camerahub-detection-ci poc/detection
          docker run --rm --entrypoint python -e PYTHONPATH=/app camerahub-detection-ci \
            -m unittest discover -s /app/tests -p 'test_*.py'

      - name: Install browser test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium chrome

      - name: Run desktop, tablet and mobile browser tests
        run: npm run test:e2e

      - name: Prepare synthetic acceptance secrets
        run: |
          mkdir -p poc/runtime/acceptance
          openssl rand -base64 32 > poc/runtime/acceptance/zmodo_secret_key
          openssl rand -base64 32 > poc/runtime/acceptance/zmodo_internal_token
          openssl rand -base64 32 > poc/runtime/acceptance/detection_adapter_token

      - name: Start real Caddy, MediaMTX and synthetic H.264 stack
        run: docker compose -f poc/acceptance/docker-compose.yml up -d --build --wait

      - name: Run real stream acceptance
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18091
          RUN_SYNTHETIC_ACCEPTANCE: "1"
        run: npx playwright test poc/e2e/synthetic-stack.spec.js --project=chrome-acceptance

      - name: Stop synthetic acceptance stack
        if: always()
        run: docker compose -f poc/acceptance/docker-compose.yml down -v --remove-orphans

      - name: Upload browser test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
