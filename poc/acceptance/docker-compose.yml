name: camera-hub-synthetic-acceptance

services:
  mediamtx:
    build: ../mediamtx
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    ports:
      # ICE candidates announce 18189, therefore the host port must match.
      - "127.0.0.1:18189:18189/udp"
      - "127.0.0.1:18189:18189/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 20

  synthetic-source:
    build: ./synthetic-source
    depends_on:
      mediamtx:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ../backend
    depends_on:
      mediamtx:
        condition: service_healthy
    environment:
      WEB_ROOT: /web
      CAMERA_CONFIG: /config/cameras.json
      MEDIAMTX_API: http://mediamtx:9997
      DATABASE_PATH: /data/camera-hub.db
      SECRET_KEY_PATH: /run/secrets/zmodo_secret_key
      INTERNAL_TOKEN_PATH: /run/secrets/zmodo_internal_token
      DISCOVERY_NETWORK: 192.0.2.0/24
      ALLOW_OWNER_SETUP: "1"
      ALLOW_INSECURE_LOOPBACK_MANAGEMENT: "1"
      TRUSTED_PROXY_NETWORKS: 172.29.33.0/24
      ZMODO_TESTING: "1"
    volumes:
      - ../web:/web:ro
      - ./cameras.json:/config/cameras.json:ro
      - acceptance-data:/data
    secrets:
      - zmodo_secret_key
      - zmodo_internal_token
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"]
      interval: 2s
      timeout: 2s
      retries: 30

  caddy:
    image: caddy:2.10.0-alpine
    depends_on:
      web:
        condition: service_healthy
      synthetic-source:
        condition: service_started
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:18091:8090"

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.33.0/24

volumes:
  acceptance-data:

secrets:
  zmodo_secret_key:
    file: ../runtime/acceptance/zmodo_secret_key
  zmodo_internal_token:
    file: ../runtime/acceptance/zmodo_internal_token
