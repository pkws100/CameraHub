name: zmodo-local-poc

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-relay: &relay
  build: ./relay
  restart: unless-stopped
  depends_on:
    mediamtx:
      condition: service_healthy
  stop_grace_period: 10s
  logging: *bounded-logging
  healthcheck:
    test: ["CMD-SHELL", "pidof vlc >/dev/null && wget -qO- http://mediamtx:9997/v3/paths/get/$${PATH_NAME} | grep -q '\"ready\":true'"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  mediamtx:
    build: ./mediamtx
    image: zmodo-mediamtx:1.19.2-health
    restart: unless-stopped
    logging: *bounded-logging
    volumes:
      - ${ZMODO_MEDIAMTX_CONFIG:-./mediamtx.yml}:/mediamtx.yml:ro
    ports:
      - "${ZMODO_BIND_IP:-127.0.0.1}:8888:8888"
      - "${ZMODO_BIND_IP:-127.0.0.1}:8889:8889"
      - "${ZMODO_BIND_IP:-127.0.0.1}:8189:8189/udp"
      - "${ZMODO_BIND_IP:-127.0.0.1}:8189:8189/tcp"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - detection-internal
      - blink-egress

  garten-low:
    <<: *relay
    # Separates Rollback-Profil: Garten wird nach bestandener dynamischer
    # Migration nicht mehr zusammen mit den übrigen statischen Relays gestartet.
    profiles: ["legacy-static-garten"]
    environment:
      RELAY_ID: garten-low
      PATH_NAME: garten-low
      # Kamera .8 akzeptierte im Folgeauftrag nur eine stabile Parallelsitzung;
      # dieser neutrale Pfad transportiert daher den Hauptstream fuer Uebersicht und Detail.
      SOURCE_URI: ${CAMERA_GARTEN_SOURCE_URI:-}
      OUTPUT_PORT: "12001"

  eingang-low:
    <<: *relay
    profiles: ["legacy-static"]
    environment:
      RELAY_ID: eingang-low
      PATH_NAME: eingang-low
      # Der Substream liefert im Browser keine neuen Frames; fuer diese Kachel wird der bestaetigte Hauptstream remuxt.
      SOURCE_URI: ${CAMERA_EINGANG_SOURCE_URI:-}
      OUTPUT_PORT: "12011"

  serverraum-low:
    <<: *relay
    profiles: ["legacy-static"]
    environment:
      RELAY_ID: serverraum-low
      PATH_NAME: serverraum-low
      SOURCE_URI: ${CAMERA_SERVERRAUM_SOURCE_URI:-}
      OUTPUT_PORT: "12021"

  rueckseite-low:
    <<: *relay
    profiles: ["legacy-static"]
    environment:
      RELAY_ID: rueckseite-low
      PATH_NAME: rueckseite-low
      SOURCE_URI: ${CAMERA_RUECKSEITE_SOURCE_URI:-}
      OUTPUT_PORT: "12031"

  einfahrt-low:
    <<: *relay
    profiles: ["legacy-static"]
    environment:
      RELAY_ID: einfahrt-low
      PATH_NAME: einfahrt-low
      SOURCE_URI: ${CAMERA_EINFAHRT_SOURCE_URI:-}
      OUTPUT_PORT: "12041"

  garage-low:
    <<: *relay
    profiles: ["legacy-static"]
    environment:
      RELAY_ID: garage-low
      PATH_NAME: garage-low
      # Der Receiver-Substream war nicht decodierbar; der framebestaetigte Hauptstream dient als Garage-Fallback.
      SOURCE_URI: ${CAMERA_GARAGE_SOURCE_URI:-}
      OUTPUT_PORT: "12051"

  web:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      WEB_ROOT: /web
      CAMERA_CONFIG: /config/cameras.json
      MEDIAMTX_API: http://mediamtx:9997
      EXTERNAL_CONTROL_HOSTS: czeview-bridge
      DATABASE_PATH: /data/zmodo.db
      SECRET_KEY_PATH: /run/secrets/zmodo_secret_key
      INTERNAL_TOKEN_PATH: /run/secrets/zmodo_internal_token
      CZEVIEW_ADAPTER_TOKEN_PATH: /run/secrets/czeview_adapter_token
      NETATMO_ADAPTER_TOKEN_PATH: /run/secrets/netatmo_adapter_token
      BLINK_ADAPTER_TOKEN_PATH: /run/secrets/blink_adapter_token
      BLINK_BRIDGE_INTERNAL: http://blink-bridge:8788
      DETECTION_ADAPTER_TOKEN_PATH: /run/secrets/detection_adapter_token
      MOTION_ASSET_ROOT: /data/motion-assets
      DISCOVERY_NETWORK: ${CAMERA_HUB_DISCOVERY_NETWORK:-192.168.1.0/24}
      TRUSTED_PROXY_NETWORKS: ${CAMERA_HUB_TRUSTED_PROXY_NETWORKS:-172.28.178.0/24}
      STATIC_AUTHENTICATED_CAMERA_IDS: ${CAMERA_HUB_STATIC_AUTHENTICATED_IDS:-}
      CAMERA_HUB_TIMEZONE: ${CAMERA_HUB_TIMEZONE:-Europe/Berlin}
      ALLOW_INSECURE_LOOPBACK_MANAGEMENT: "1"
      ALLOW_OWNER_SETUP: ${CAMERA_HUB_ALLOW_OWNER_SETUP:-0}
      MAX_CAMERAS: "32"
    secrets:
      - zmodo_secret_key
      - zmodo_internal_token
      - czeview_adapter_token
      - netatmo_adapter_token
      - blink_adapter_token
      - detection_adapter_token
    volumes:
      - ./web:/web:ro
      - ./backend/cameras.json:/config/cameras.json:ro
      - zmodo-data:/data
    ports:
      - "${ZMODO_BIND_IP:-127.0.0.1}:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - detection-internal
      - blink-egress

  detection-worker:
    build: ./detection
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      BACKEND_INTERNAL: http://web:8090
      DETECTION_ADAPTER_TOKEN_PATH: /run/secrets/detection_adapter_token
      DETECTION_POLL_SECONDS: "5"
    secrets:
      - detection_adapter_token
    networks:
      - detection-internal
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=256m
      - /run/detection-health:mode=0777,size=1m
    cpus: "4.0"
    mem_limit: 1536m
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/detection-health/worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  relay-manager:
    build: ./manager
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      BACKEND_INTERNAL: http://web:8090
      MEDIAMTX_API: http://mediamtx:9997
      INTERNAL_TOKEN_PATH: /run/secrets/zmodo_internal_token
    secrets:
      - zmodo_internal_token
    tmpfs:
      - /run/relay-secrets:mode=0700,uid=100,gid=101
      - /run/relay-health:mode=0755,uid=100,gid=101
    healthcheck:
      test: ["CMD-SHELL", "test -f /run/relay-health/manager"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  czeview-bridge:
    build: ./czeview
    profiles: ["czeview"]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      BACKEND_INTERNAL: http://web:8090
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_PUBLISH_URL: rtsp://mediamtx:8554/czeview-low
      INTERNAL_TOKEN_PATH: /run/secrets/zmodo_internal_token
      CZEVIEW_ADAPTER_TOKEN_PATH: /run/secrets/czeview_adapter_token
      CZEVIEW_CREDENTIALS_PATH: /run/secrets/czeview_credentials
      CZEVIEW_SESSION_PATH: /data/session.json
      CZEVIEW_CAMERA_ID: czeview
      CZEVIEW_STREAM_PATH: czeview-low
      CZEVIEW_CONTROL_PORT: "8787"
    secrets:
      - zmodo_internal_token
      - czeview_adapter_token
      - czeview_credentials
    volumes:
      - czeview-session:/data
    expose:
      - "8787"
    tmpfs:
      - /run/bridge-health:mode=0755,uid=100,gid=101
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bridge-health/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  netatmo-bridge:
    build: ./netatmo
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      BACKEND_INTERNAL: http://web:8090
      MEDIAMTX_API: http://mediamtx:9997
      NETATMO_ADAPTER_TOKEN_PATH: /run/secrets/netatmo_adapter_token
    secrets:
      - netatmo_adapter_token
    tmpfs:
      - /run/bridge-health:mode=0755,uid=100,gid=101
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bridge-health/state"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  blink-bridge:
    build: ./blink
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      mediamtx:
        condition: service_healthy
    logging: *bounded-logging
    environment:
      BACKEND_INTERNAL: http://web:8090
      MEDIAMTX_API: http://mediamtx:9997
      MEDIAMTX_PUBLISH: rtsp://mediamtx:8554
      BLINK_ADAPTER_TOKEN_PATH: /run/secrets/blink_adapter_token
      BLINK_REFRESH_SECONDS: "60"
      BLINK_LEASE_POLL_SECONDS: "2"
    secrets:
      - blink_adapter_token
    expose:
      - "8788"
    networks:
      - blink-egress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:mode=1777,size=128m
      - /run/bridge-health:mode=0777,size=1m
    cpus: "2.0"
    mem_limit: 768m
    pids_limit: 128
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "test -s /run/bridge-health/state && test $$(($$(date +%s) - $$(cat /run/bridge-health/state))) -lt 90"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.178.0/24
  detection-internal:
    internal: true
    ipam:
      config:
        - subnet: 172.28.179.0/24
  blink-egress:
    ipam:
      config:
        - subnet: 172.28.180.0/24

volumes:
  zmodo-data:
  czeview-session:

secrets:
  zmodo_secret_key:
    file: ./runtime/secrets/zmodo_secret_key
  zmodo_internal_token:
    file: ./runtime/secrets/zmodo_internal_token
  czeview_adapter_token:
    file: ./runtime/secrets/czeview_adapter_token
  netatmo_adapter_token:
    file: ./runtime/secrets/netatmo_adapter_token
  blink_adapter_token:
    file: ./runtime/secrets/blink_adapter_token
  detection_adapter_token:
    file: ./runtime/secrets/detection_adapter_token
  czeview_credentials:
    file: ./runtime/secrets/czeview_credentials.json
